name: CI

# CI runs the same gate as developers: `bun run gate`. Keep logic in
# scripts/gate.ts, not here; this file only provides the toolchain.
on:
  push:
    branches: [main]
  # Every pull request, including stacked ones based on another branch.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium

      - name: Install PostgreSQL server tools for the MCP acceptance cluster
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - run: bun run gate
        env:
          GATE_POSTGRES_URL: postgresql://postgres:password@localhost:5432/postgres

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: gate-logs-${{ github.run_attempt }}
          path: .gate/
          include-hidden-files: true
          retention-days: 14
