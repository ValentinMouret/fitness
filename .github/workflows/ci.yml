name: CI

# CI runs the same gate as developers: `bun run gate`. Keep logic in
# scripts/gate.ts, not here; this file only provides the toolchain.
on:
  push:
    branches: [main]
  # Every pull request, including stacked ones based on another branch.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium webkit

      - name: Install PostgreSQL server tools for the MCP acceptance cluster
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - run: bun run gate
        env:
          GATE_POSTGRES_URL: postgresql://postgres:password@localhost:5432/postgres

      - uses: actions/upload-artifact@v4
        id: gate_logs
        if: ${{ !cancelled() }}
        with:
          name: gate-logs-${{ github.run_attempt }}
          path: .gate/
          include-hidden-files: true
          retention-days: 14

      - name: Link gate evidence
        if: ${{ !cancelled() && steps.gate_logs.outputs.artifact-url != '' }}
        env:
          GATE_ARTIFACT_URL: ${{ steps.gate_logs.outputs.artifact-url }}
        run: |
          printf '[Gate logs and evidence](%s)\n\n' "$GATE_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .gate/summary.md ]; then
            printf 'Open `summary.md` in the artifact for source identity, failed stages, evidence links and the rerun command.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy Scaleway
    needs: gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: scaleway-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build and deploy verified revision
        run: bash scripts/deploy-scaleway-ci.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SCALEWAY_DEPLOY_HOST: ${{ vars.SCALEWAY_DEPLOY_HOST }}
          SCALEWAY_DEPLOY_SSH_KEY: ${{ secrets.SCALEWAY_DEPLOY_SSH_KEY }}
          SCALEWAY_DEPLOY_KNOWN_HOSTS: ${{ secrets.SCALEWAY_DEPLOY_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
