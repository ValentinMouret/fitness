name: fitness
x-service: &service
  network_mode: host
  restart: unless-stopped
services:
  postgres:
    <<: *service
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command: [postgres, -c, listen_addresses=127.0.0.1, -c, shared_buffers=64MB, -c, max_connections=30]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
  app:
    <<: *service
    image: ${APP_IMAGE:?Set APP_IMAGE in release.env}
    entrypoint: []
    environment: &app-environment
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: '5174'
      NODE_OPTIONS: --max-old-space-size=256
      DATABASE_URL:
      MCP_DATABASE_URL:
      ANTHROPIC_API_KEY:
      ANTHROPIC_MODEL:
      AUTH_USERNAME:
      AUTH_PASSWORD:
      AUTH_SESSION_SECRET:
      AUTH_SESSION_TTL_SECONDS:
      AUTH_FOUNDATION_ENABLED:
      AUTH_FOUNDATION_ORIGIN:
      AUTH_FOUNDATION_OWNER_USER_ID:
      AUTH_LOCAL_INBOX:
      AUTH_SMTP_HOST:
      AUTH_SMTP_PORT:
      AUTH_SMTP_SECURE:
      AUTH_SMTP_USER:
      AUTH_SMTP_PASSWORD:
      AUTH_SMTP_FROM:
      AUTH_EMAIL_FROM:
      RESEND_API_KEY:
      AUTH_INVITATION_TTL_SECONDS:
      OAUTH_ISSUER_URL:
      OAUTH_CLIENTS:
      OAUTH_CODE_TTL_SECONDS:
      OAUTH_ACCESS_TTL_SECONDS:
      OAUTH_REFRESH_TTL_SECONDS:
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5174/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 384m
  maintenance:
    network_mode: host
    profiles: [maintenance]
    image: ${APP_IMAGE:?Set APP_IMAGE in release.env}
    entrypoint: [bun]
    environment:
      <<: *app-environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the administrator connection}
      APP_DATABASE_URL: ${DATABASE_URL:?Set the fitness_app connection}
    volumes:
      - ./provision-runtime.ts:/app/deploy/provision-runtime.ts:ro
    mem_limit: 384m
  # Serves the app and CI's SSH; the VM accepts no inbound web traffic.
  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2026.10.7
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    command: [tunnel, --no-autoupdate, --edge-ip-version, '6', run]
    mem_limit: 128m
volumes:
  postgres:
