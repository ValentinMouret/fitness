name: fitness
x-service: &service
  network_mode: host
  restart: unless-stopped
  env_file:
    - path: ./.env
      format: raw
services:
  postgres:
    <<: *service
    image: postgres:17-alpine
    command: [postgres, -c, listen_addresses=127.0.0.1, -c, shared_buffers=64MB, -c, max_connections=30]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
  app:
    <<: *service
    image: ${APP_IMAGE:?Set APP_IMAGE in release.env}
    entrypoint: []
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: '5174'
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5174/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 384m
  # Serves the app and CI's SSH; the VM accepts no inbound web traffic.
  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2026.10.7
    command: [tunnel, --no-autoupdate, --edge-ip-version, '6', run]
    mem_limit: 128m
volumes:
  postgres:
